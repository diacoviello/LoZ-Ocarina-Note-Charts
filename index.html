<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ocarina Note Charts</title>
<meta name="description" content="Note and fingering charts for the ocarina in The Legend of Zelda: Ocarina of Time on Nintendo Switch 2.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cellipse cx='16' cy='17' rx='13' ry='10' fill='%232443a3'/%3E%3Ccircle cx='11' cy='15' r='2' fill='%23fff'/%3E%3Ccircle cx='17' cy='13' r='2' fill='%23fff'/%3E%3Ccircle cx='22' cy='17' r='2' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Colors match the two chart pages so the shell and the frame read as one page. */
:root {
  color-scheme: light dark;
  --paper: #eef1f6;
  --surface: #ffffff;
  --ink: #18203a;
  --muted: #5a6479;
  --line: #d3d9e4;
  --accent: #2443a3;
  --accent-soft: #e2e8f8;
  --shadow: 0 8px 24px rgb(24 32 58 / .14);
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --bar-h: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1320;
    --surface: #161d2d;
    --ink: #e5e9f2;
    --muted: #98a2b6;
    --line: #2a3347;
    --accent: #93a9ff;
    --accent-soft: #1e2948;
    --shadow: 0 8px 24px rgb(0 0 0 / .45);
  }
}
:root[data-theme="dark"] {
  --paper: #0e1320;
  --surface: #161d2d;
  --ink: #e5e9f2;
  --muted: #98a2b6;
  --line: #2a3347;
  --accent: #93a9ff;
  --accent-soft: #1e2948;
  --shadow: 0 8px 24px rgb(0 0 0 / .45);
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  display: flex;
  flex-direction: column;
  background: var(--paper);
  color: var(--ink);
  font: 15px/1.4 var(--f-body);
}

/* Top bar */
.bar {
  position: relative;
  z-index: 10;
  display: flex;
  align-items: stretch;
  gap: 16px;
  min-height: var(--bar-h);
  padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
@font-face { font-family: "Hylia Serif"; src: url("fonts/HyliaSerifBeta-Regular.otf") format("opentype"); font-display: swap; }
@font-face { font-family: "Hylian Symbols"; src: url("fonts/HylianSymbols.ttf") format("truetype"); font-display: block; }
.brand {
  align-self: center;
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0;
  font: 400 18px "Hylia Serif", Georgia, serif;
  font-synthesis: none;
  color: var(--ink);
  white-space: nowrap;
}
.brand .glyph {
  font: 400 15px "Hylian Symbols";
  color: var(--accent);
  user-select: none;
}

/* Tabs */
nav { display: flex; min-width: 0; }
.tabs li { display: flex; }
.tabs {
  display: flex;
  gap: 4px;
  margin: 0;
  padding: 0;
  list-style: none;
  min-width: 0;
}
.tabs a {
  display: flex;
  align-items: center;
  height: 100%;
  padding: 0 14px;
  color: var(--muted);
  font-weight: 500;
  text-decoration: none;
  white-space: nowrap;
  border-bottom: 3px solid transparent;
  border-top: 3px solid transparent;
}
.tabs a:hover { color: var(--ink); }
.tabs a[aria-current="page"] {
  color: var(--accent);
  font-weight: 600;
  border-bottom-color: var(--accent);
}
.tabs a:focus-visible,
.dl-btn:focus-visible,
.dl-menu a:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: -2px;
  border-radius: 6px;
}
.short { display: none; }

/* Download menu */
.dl {
  position: relative;
  margin-left: auto;
  align-self: center;
}
.dl-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 36px;
  padding: 0 14px;
  font: 600 14px var(--f-body);
  color: var(--accent);
  background: var(--accent-soft);
  border: 1px solid transparent;
  border-radius: 8px;
  cursor: pointer;
  white-space: nowrap;
}
.dl-btn:hover { border-color: var(--accent); }
.dl-btn svg { width: 16px; height: 16px; flex: none; }
.dl-btn .chev { width: 12px; height: 12px; transition: transform .15s; }
.dl-btn[aria-expanded="true"] .chev { transform: rotate(180deg); }

.dl-menu {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  width: 280px;
  max-width: calc(100vw - 32px);
  margin: 0;
  padding: 6px;
  list-style: none;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: var(--shadow);
}
.dl-menu[hidden] { display: none; }
.dl-head {
  padding: 8px 10px 6px;
  font: 600 11px var(--f-mono);
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
}
.dl-menu a {
  display: grid;
  grid-template-columns: 40px 1fr;
  align-items: center;
  gap: 2px 10px;
  padding: 10px;
  color: var(--ink);
  text-decoration: none;
  border-radius: 6px;
}
.dl-menu a:hover { background: var(--accent-soft); }
.badge {
  grid-row: span 2;
  display: grid;
  place-items: center;
  height: 32px;
  font: 600 11px var(--f-mono);
  color: var(--accent);
  border: 1px solid var(--line);
  border-radius: 6px;
}
.dl-menu strong { font-weight: 600; }
.dl-menu small { color: var(--muted); font-size: 13px; }

/* Chart frames */
main { position: relative; flex: 1; min-height: 0; }
iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
  background: var(--paper);
}
iframe[hidden] { display: none; }

@media (max-width: 760px) {
  .brand { display: none; }
}
@media (max-width: 520px) {
  .bar { gap: 8px; }
  .tabs a { padding: 0 10px; }
  .long { display: none; }
  .short { display: inline; }
  .dl-btn { padding: 0 10px; }
}
@media (prefers-reduced-motion: reduce) {
  .dl-btn .chev { transition: none; }
}
</style>
</head>
<body>

<header class="bar">
  <p class="brand"><span class="glyph" aria-hidden="true">b</span>Ocarina of Time · Switch 2</p>

  <nav aria-label="Charts">
    <ul class="tabs" id="tabs"></ul>
  </nav>

  <div class="dl">
    <button class="dl-btn" id="dl-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="dl-menu">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M2.5 13.5h11"/></svg>
      <span class="long">Download a copy</span><span class="short">Download</span>
      <svg class="chev" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 4.5 3 3 3-3"/></svg>
    </button>
    <ul class="dl-menu" id="dl-menu" hidden>
      <li class="dl-head" id="dl-head"></li>
      <li><a id="dl-pdf" download>
        <span class="badge" aria-hidden="true">PDF</span>
        <strong>PDF</strong>
        <small id="dl-pdf-note"></small>
      </a></li>
      <li><a id="dl-md" download>
        <span class="badge" aria-hidden="true">MD</span>
        <strong>Markdown</strong>
        <small id="dl-md-note"></small>
      </a></li>
    </ul>
  </div>
</header>

<main id="frames"></main>

<script>
// Each tab: the HTML page it shows and the two files its download menu offers.
// To add a chart, add an entry here.
const CHARTS = [
  {
    id: "note-chart",
    label: "Note Chart",
    short: "Notes",
    page: "Zelda Switch 2 Ocarina Note Chart.html",
    pdf: { file: "downloadable-files/Ocarina Note Chart.pdf", note: "Printable · 206 KB" },
    md:  { file: "downloadable-files/Zelda Switch 2 Ocarina Note Chart.md", note: "Plain text · 1 KB" },
  },
  {
    id: "major-keys",
    label: "Major Key Fingerings",
    short: "Major keys",
    page: "Ocarina Major Key Fingerings.html",
    // Built from the fingerings on screen (the page's window.ocarinaExport); the files are a fallback.
    generated: true,
    pdf: { file: "downloadable-files/Ocarina Major Key Fingerings.pdf", note: "Printable · with your fingerings" },
    md:  { file: "downloadable-files/Ocarina Major Key Fingerings.md", note: "Plain text · with your fingerings" },
  },
];

const tabsEl = document.getElementById("tabs");
const framesEl = document.getElementById("frames");
const btn = document.getElementById("dl-btn");
const menu = document.getElementById("dl-menu");
const enc = (path) => path.split("/").map(encodeURIComponent).join("/");
const frames = {};
let current = null;

// Build tabs. Frames are created on first visit and kept, so switching back keeps your scroll position.
for (const c of CHARTS) {
  const li = document.createElement("li");
  const a = document.createElement("a");
  a.href = "#" + c.id;
  a.dataset.id = c.id;
  a.innerHTML = `<span class="long"></span><span class="short"></span>`;
  a.querySelector(".long").textContent = c.label;
  a.querySelector(".short").textContent = c.short;
  li.append(a);
  tabsEl.append(li);
}

function show(id) {
  const chart = CHARTS.find((c) => c.id === id) || CHARTS[0];
  current = chart;

  if (!frames[chart.id]) {
    const f = document.createElement("iframe");
    f.src = enc(chart.page);
    f.title = chart.label;
    framesEl.append(f);
    frames[chart.id] = f;
  }
  for (const [key, f] of Object.entries(frames)) f.hidden = key !== chart.id;

  for (const a of tabsEl.querySelectorAll("a")) {
    if (a.dataset.id === chart.id) a.setAttribute("aria-current", "page");
    else a.removeAttribute("aria-current");
  }

  document.getElementById("dl-head").textContent = chart.label;
  for (const kind of ["pdf", "md"]) {
    const link = document.getElementById("dl-" + kind);
    link.href = enc(chart[kind].file);
    link.download = chart[kind].file.split("/").pop();
    document.getElementById(`dl-${kind}-note`).textContent = chart[kind].note;
  }

  document.title = `${chart.label} · Ocarina Note Charts`;
  closeMenu();
}

// Download menu
function openMenu() {
  menu.hidden = false;
  btn.setAttribute("aria-expanded", "true");
}
function closeMenu(focusButton) {
  if (menu.hidden) return;
  menu.hidden = true;
  btn.setAttribute("aria-expanded", "false");
  if (focusButton) btn.focus();
}
btn.addEventListener("click", () => (menu.hidden ? openMenu() : closeMenu()));
menu.addEventListener("click", (e) => { if (e.target.closest("a")) closeMenu(); });
document.addEventListener("click", (e) => { if (!e.target.closest(".dl")) closeMenu(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeMenu(true); });
// Clicking inside a chart frame doesn't reach this document, so close the menu when the page loses focus.
window.addEventListener("blur", () => closeMenu());

// Personalized downloads: ask the chart page to build the file instead of fetching the static copy.
const btnLabel = btn.querySelector(".long"), btnShort = btn.querySelector(".short");
function setBusy(text) {
  btn.disabled = !!text;
  btn.style.cursor = text ? "progress" : "";
  btnLabel.textContent = text || "Download a copy";
  btnShort.textContent = text ? "Building…" : "Download";
}
function saveBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}
for (const kind of ["pdf", "md"]) {
  const link = document.getElementById("dl-" + kind);
  link.addEventListener("click", async (e) => {
    const api = current.generated && frames[current.id]?.contentWindow?.ocarinaExport;
    if (!api) return; // not ready: the link downloads the static file
    e.preventDefault();
    closeMenu();
    setBusy(kind === "pdf" ? "Building PDF…" : "Building file…");
    try {
      const { blob, filename } = await api[kind]();
      saveBlob(blob, filename);
    } catch (err) {
      console.error(err);
      saveBlob(await (await fetch(link.href)).blob(), link.download);
    } finally {
      setBusy(null);
    }
  });
}

window.addEventListener("hashchange", () => show(location.hash.slice(1)));
show(location.hash.slice(1));
</script>
</body>
</html>
